name: release

# Push a tag like v0.1.0: builds desk for macOS (Apple Silicon), Linux and
# Windows and attaches the bundles to the GitHub release for that tag. Run by
# hand (workflow_dispatch) it only builds them, as artifacts of the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # tmux ships inside the app and the AppImage (built by
          # .github/build-tmux.sh); the .deb depends on the distribution's.
          - platform: macos-latest
            target: aarch64-apple-darwin
            tmux: true
            args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.tmux.conf.json
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tmux: true
            args: --bundles appimage --config src-tauri/tauri.tmux.conf.json
            deb: --bundles deb --config src-tauri/tauri.deb.conf.json
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libncurses-dev bison

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: tmux for the bundle
        if: matrix.tmux
        run: sh .github/build-tmux.sh ${{ matrix.target }}

      - run: pnpm tauri build ${{ matrix.args }}
      - if: matrix.deb
        run: pnpm tauri build ${{ matrix.deb }}

      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/nsis/*-setup.exe

  # The bundles go to the GitHub release for the tag (on a tag push).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Notes: the tag's section of CHANGELOG.md, then how to install.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh .github/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "desk $GITHUB_REF_NAME" \
            --notes-file notes.md $(find dist -type f)
